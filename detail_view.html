<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Sri Lanka – Destination Detail</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --forest: #1a2e1e;
        --gold: #c9954a;
        --gold-light: #e8b96a;
        --cream: #f7f3ed;
        --warm-white: #fdfaf6;
        --text-dark: #1c1c1c;
        --text-mid: #5a5a5a;
        --text-light: #9a9a9a;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--warm-white);
        color: var(--text-dark);
        min-height: 100vh;
      }

      /* ── NAV ── */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.1rem 3rem;
        background: rgba(253, 250, 246, 0.93);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(201, 149, 74, 0.15);
      }
      .nav-logo {
        font-family: "Playfair Display", serif;
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--forest);
      }
      .nav-logo span {
        color: var(--gold);
      }
      .nav-back {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: none;
        border: none;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-mid);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: color 0.2s;
      }
      .nav-back:hover {
        color: var(--gold);
      }

      /* ── HERO ── */
      #page-detail {
        padding-top: 72px;
      }
      .detail-hero {
        position: relative;
        height: 75vh;
        min-height: 500px;
        overflow: hidden;
      }
      .detail-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        animation: heroZoom 10s ease-out forwards;
      }
      @keyframes heroZoom {
        from {
          transform: scale(1.08);
        }
        to {
          transform: scale(1);
        }
      }
      .detail-hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(10, 20, 12, 0.22) 0%,
          rgba(10, 20, 12, 0.62) 100%
        );
      }
      .detail-hero-content {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 3rem 4rem;
        animation: fadeUp 0.65s ease 0.1s both;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .detail-country {
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold-light);
        margin-bottom: 0.55rem;
      }
      .detail-name {
        font-family: "Playfair Display", serif;
        font-size: clamp(2.6rem, 6vw, 4.8rem);
        font-weight: 600;
        color: #fff;
        line-height: 1.05;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
      }

      /* ── BODY ── */
      .detail-body {
        max-width: 920px;
        margin: 0 auto;
        padding: 4rem 3rem 2rem;
        animation: fadeUp 0.65s ease 0.22s both;
      }
      .detail-meta {
        display: flex;
        gap: 2.5rem;
        flex-wrap: wrap;
        margin-bottom: 2.8rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid rgba(201, 149, 74, 0.2);
      }
      .meta-item {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .meta-label {
        font-size: 0.62rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .meta-value {
        font-size: 0.95rem;
        color: var(--text-dark);
        font-weight: 500;
      }
      .about-section {
        margin-bottom: 3.2rem;
      }
      .about-section-label {
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 0.7rem;
      }
      .about-title {
        font-family: "Playfair Display", serif;
        font-size: 1.85rem;
        color: var(--forest);
        margin-bottom: 1.1rem;
        line-height: 1.25;
      }
      .about-text {
        font-size: 1rem;
        color: var(--text-mid);
        line-height: 1.85;
        max-width: 700px;
      }
      .about-text + .about-text {
        margin-top: 1rem;
      }
      .highlights {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
        gap: 1rem;
        margin-bottom: 3.2rem;
      }
      .highlight-card {
        background: var(--cream);
        border-radius: 12px;
        padding: 1.15rem 1.35rem;
        border: 1px solid rgba(201, 149, 74, 0.14);
      }
      .highlight-icon {
        font-size: 1.35rem;
        margin-bottom: 0.45rem;
      }
      .highlight-title {
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--forest);
        margin-bottom: 0.15rem;
      }
      .highlight-desc {
        font-size: 0.73rem;
        color: var(--text-light);
      }
      .detail-rating-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 2.8rem;
      }
      .detail-stars {
        color: var(--gold);
        font-size: 1.1rem;
      }
      .detail-score {
        font-size: 0.9rem;
        color: var(--text-mid);
        font-weight: 500;
      }
      .book-section {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 3.5rem;
      }
      .btn-book {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        background: var(--forest);
        color: var(--cream);
        border: none;
        cursor: pointer;
        padding: 1rem 2.2rem;
        border-radius: 50px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        transition:
          background 0.25s,
          transform 0.2s,
          box-shadow 0.25s;
        box-shadow: 0 4px 20px rgba(26, 46, 30, 0.25);
      }
      .btn-book:hover {
        background: #2d4a32;
        transform: translateY(-2px);
      }
      .btn-book-icon {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--gold);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .btn-map-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: none;
        border: 1.5px solid rgba(201, 149, 74, 0.4);
        cursor: pointer;
        padding: 1rem 1.8rem;
        border-radius: 50px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        color: var(--text-mid);
        text-decoration: none;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .btn-map-link:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      /* ══ REVIEWS SECTION ══ */
      .reviews-section {
        max-width: 920px;
        margin: 0 auto;
        padding: 0 3rem 5rem;
      }

      .reviews-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 2rem;
        padding-bottom: 1.2rem;
        border-bottom: 1px solid rgba(201, 149, 74, 0.2);
      }
      .reviews-title {
        font-family: "Playfair Display", serif;
        font-size: 1.5rem;
        color: var(--forest);
      }
      .reviews-avg {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      .avg-big {
        font-size: 2.8rem;
        font-weight: 700;
        color: var(--forest);
        line-height: 1;
      }
      .avg-stars {
        color: var(--gold);
        font-size: 1.3rem;
      }
      .avg-count {
        font-size: 0.85rem;
        color: var(--text-light);
      }

      /* review cards */
      .reviews-list {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        margin-bottom: 2.8rem;
      }
      .review-card {
        background: var(--cream);
        border-radius: 12px;
        padding: 1.3rem 1.5rem;
        border: 1px solid rgba(201, 149, 74, 0.12);
      }
      .review-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.5rem;
      }
      .reviewer-name {
        font-weight: 600;
        color: var(--forest);
        font-size: 0.95rem;
      }
      .review-stars {
        color: var(--gold);
        font-size: 0.9rem;
      }
      .review-date {
        font-size: 0.75rem;
        color: var(--text-light);
        margin-bottom: 0.5rem;
      }
      .review-text {
        font-size: 0.9rem;
        color: var(--text-mid);
        line-height: 1.65;
      }

      /* leave a review form */
      .leave-review-box {
        background: var(--cream);
        border-radius: 16px;
        padding: 2rem 2.2rem;
        border: 1px solid rgba(201, 149, 74, 0.18);
      }
      .leave-review-box h4 {
        font-family: "Playfair Display", serif;
        font-size: 1.2rem;
        color: var(--forest);
        margin-bottom: 1.4rem;
      }
      .rev-form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .rev-form-row.single {
        grid-template-columns: 1fr;
      }
      .rev-label {
        display: block;
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 0.45rem;
      }
      .rev-input,
      .rev-select,
      .rev-textarea {
        width: 100%;
        background: #fff;
        border: 1.5px solid rgba(201, 149, 74, 0.25);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        color: var(--text-dark);
        outline: none;
        transition: border-color 0.2s;
      }
      .rev-input:focus,
      .rev-select:focus,
      .rev-textarea:focus {
        border-color: var(--gold);
      }
      .rev-textarea {
        resize: vertical;
        min-height: 100px;
      }
      /* star picker */
      .star-picker {
        display: flex;
        gap: 0.3rem;
      }
      .star-picker span {
        font-size: 1.6rem;
        cursor: pointer;
        color: #ddd;
        transition: color 0.15s;
        line-height: 1;
      }
      .star-picker span.on {
        color: var(--gold);
      }
      .btn-submit-review {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background: var(--forest);
        color: var(--cream);
        border: none;
        cursor: pointer;
        padding: 0.85rem 2rem;
        border-radius: 50px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: 1.2rem;
        transition:
          background 0.2s,
          transform 0.15s;
      }
      .btn-submit-review:hover {
        background: #2d4a32;
        transform: translateY(-1px);
      }
      .btn-submit-review:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      /* empty state */
      .no-reviews {
        text-align: center;
        padding: 2.5rem 1rem;
        color: var(--text-light);
        font-size: 0.95rem;
      }

      /* ── BOOKING MODAL ── */
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 20, 12, 0.55);
        z-index: 500;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(6px);
      }
      .modal-backdrop.open {
        display: flex;
      }
      .booking-modal {
        background: var(--warm-white);
        border-radius: 20px;
        padding: 2.5rem 2.8rem;
        max-width: 480px;
        width: 92%;
        position: relative;
        animation: fadeUp 0.3s ease;
      }
      .modal-close {
        position: absolute;
        top: 1rem;
        right: 1.2rem;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
        color: var(--text-light);
      }
      .modal-tag {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 0.6rem;
      }
      .booking-modal h3 {
        font-family: "Playfair Display", serif;
        font-size: 1.4rem;
        color: var(--forest);
        margin-bottom: 0.3rem;
      }
      .modal-dest-name {
        font-size: 0.88rem;
        color: var(--text-mid);
        margin-bottom: 1.6rem;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.9rem;
        margin-bottom: 0.9rem;
      }
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin-bottom: 0.9rem;
      }
      .form-row label {
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .form-row input,
      .form-row select {
        border: 1.5px solid rgba(201, 149, 74, 0.25);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }
      .form-row input:focus,
      .form-row select:focus {
        border-color: var(--gold);
      }
      .btn-confirm {
        width: 100%;
        padding: 1rem;
        background: var(--forest);
        color: var(--cream);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        margin-top: 0.4rem;
        transition:
          background 0.2s,
          transform 0.15s;
      }
      .btn-confirm:hover {
        background: #2d4a32;
        transform: translateY(-1px);
      }

      @media (max-width: 768px) {
        nav {
          padding: 1rem 1.4rem;
        }
        .detail-hero-content {
          padding: 2rem 1.5rem;
        }
        .detail-body,
        .reviews-section {
          padding-left: 1.4rem;
          padding-right: 1.4rem;
        }
        .rev-form-row {
          grid-template-columns: 1fr;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- ══ NAV ══ -->
    <nav>
      <div class="nav-logo">Explore<span>SL</span></div>
      <button class="nav-back" onclick="history.back()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path
            d="M10 12L6 8L10 4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Back to destinations
      </button>
    </nav>

    <!-- ══ DETAIL PAGE ══ -->
    <div id="page-detail">
      <div class="detail-hero">
        <img id="detail-img" src="" alt="" />
        <div class="detail-hero-overlay"></div>
        <div class="detail-hero-content">
          <div class="detail-country" id="detail-country">Sri Lanka</div>
          <div class="detail-name" id="detail-name">Loading...</div>
        </div>
      </div>

      <div class="detail-body">
        <div id="detail-rating-row" class="detail-rating-row"></div>
        <div class="detail-meta" id="detail-meta"></div>

        <div class="about-section">
          <div class="about-section-label">About this destination</div>
          <div class="about-title" id="about-title"></div>
          <p class="about-text" id="about-text1"></p>
        </div>

        <div class="highlights" id="detail-highlights"></div>

        <div class="book-section">
          <button class="btn-book" onclick="openModal()">
            <div class="btn-book-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path
                  d="M4 8h8M8 4l4 4-4 4"
                  stroke="#fff"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            Book Vehicle &amp; Guider
          </button>
          <a id="detail-map-link" href="#" target="_blank" class="btn-map-link"
            >📍 View on Map</a
          >
        </div>
      </div>

      <!-- ══ REVIEWS SECTION ══ -->
      <div class="reviews-section">
        <div class="reviews-header">
          <div class="reviews-title">Visitor Reviews</div>
          <div class="reviews-avg">
            <div class="avg-big" id="avg-big">—</div>
            <div>
              <div class="avg-stars" id="avg-stars">☆☆☆☆☆</div>
              <div class="avg-count" id="avg-count">No reviews yet</div>
            </div>
          </div>
        </div>

        <div class="reviews-list" id="reviewsList">
          <div class="no-reviews">Loading reviews...</div>
        </div>

        <!-- ── Leave a Review Form ── -->
        <div class="leave-review-box">
          <h4>Leave a Review</h4>
          <div class="rev-form-row">
            <div>
              <label class="rev-label">Your Name *</label>
              <input
                type="text"
                id="rev-name"
                class="rev-input"
                placeholder="e.g. Kasun Perera"
              />
            </div>
            <div>
              <label class="rev-label">Your Rating *</label>
              <div class="star-picker" id="starPicker">
                <span data-v="1">★</span>
                <span data-v="2">★</span>
                <span data-v="3">★</span>
                <span data-v="4">★</span>
                <span data-v="5">★</span>
              </div>
            </div>
          </div>
          <div class="rev-form-row single">
            <div>
              <label class="rev-label">Your Review *</label>
              <textarea
                id="rev-text"
                class="rev-textarea"
                placeholder="Share your experience..."
              ></textarea>
            </div>
          </div>
          <button
            class="btn-submit-review"
            id="submitRevBtn"
            onclick="submitReview()"
          >
            <i class="fa-solid fa-paper-plane"></i> Post Review
          </button>
        </div>
      </div>
    </div>

    <!-- ══ BOOKING MODAL ══ -->
    <div
      class="modal-backdrop"
      id="modalBackdrop"
      onclick="closeModalOutside(event)"
    >
      <div class="booking-modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-tag">Reserve your experience</div>
        <h3>Book Vehicle &amp; Guider</h3>
        <p class="modal-dest-name" id="modal-dest-name"></p>
        <div class="form-grid">
          <div class="form-row">
            <label>Full Name</label
            ><input type="text" placeholder="Your name" />
          </div>
          <div class="form-row">
            <label>Phone Number</label
            ><input type="tel" placeholder="+94 7X XXX XXXX" />
          </div>
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label>Travel Date</label><input type="date" />
          </div>
          <div class="form-row">
            <label>Group Size</label>
            <select>
              <option>1 person</option>
              <option>2 people</option>
              <option>3–5 people</option>
              <option>6–10 people</option>
              <option>10+ people</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>Vehicle Type</label>
          <select>
            <option>Tuk-Tuk (1–3 pax)</option>
            <option>Car – Sedan (1–4 pax)</option>
            <option>SUV / Jeep (1–6 pax)</option>
            <option>Van / Minibus (7–12 pax)</option>
          </select>
        </div>
        <button class="btn-confirm" onclick="confirmBooking()">
          Confirm Booking →
        </button>
      </div>
    </div>

    <script>
      // ═══════════════════════════════════════════════════
      //  detail_view.html
      //  Loads destination + reviews from destinations_api.php
      // ═══════════════════════════════════════════════════

      var DEST_ID =
        parseInt(new URLSearchParams(window.location.search).get("id")) || 1;
      var API = "php/destinations_api.php";
      var selectedRating = 0;

      // ── Load destination detail from DB ──────────────────
      function loadDestination() {
        fetch(API + "?action=fetch")
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            if (!data.success || !data.data.length) {
              document.getElementById("detail-name").textContent =
                "Destination not found";
              return;
            }
            var d =
              data.data.find(function (x) {
                return x.id == DEST_ID;
              }) || data.data[0];
            renderDestination(d);
          })
          .catch(function () {
            document.getElementById("detail-name").textContent =
              "Failed to load.";
          });
      }

      function renderDestination(d) {
        document.title = "ExploreSL – " + d.name;

        var img = document.getElementById("detail-img");
        img.src = d.image;
        img.alt = d.alt_text || d.name;
        img.onerror = function () {
          this.src = "images/hero-sri-lanka.jpg";
        };

        document.getElementById("detail-name").textContent = d.name;
        document.getElementById("detail-country").textContent = "Sri Lanka";
        document.getElementById("modal-dest-name").textContent = d.name;
        document.getElementById("about-title").textContent = d.name;
        document.getElementById("about-text1").textContent = d.description;

        // Avg rating row
        var avg = parseFloat(d.avg_rating) || 0;
        var cnt = parseInt(d.review_count) || 0;
        var stars = "";
        for (var i = 1; i <= 5; i++) stars += i <= Math.round(avg) ? "★" : "☆";
        document.getElementById("detail-rating-row").innerHTML =
          '<span class="detail-stars">' +
          stars +
          "</span>" +
          '<span class="detail-score">' +
          (avg || "—") +
          "/5 &nbsp;(" +
          cnt +
          " reviews)</span>";

        // Meta strip — static but meaningful
        document.getElementById("detail-meta").innerHTML =
          '<div class="meta-item"><div class="meta-label">Location</div><div class="meta-value">Sri Lanka</div></div>' +
          '<div class="meta-item"><div class="meta-label">Reviews</div><div class="meta-value">' +
          cnt +
          "</div></div>" +
          '<div class="meta-item"><div class="meta-label">Rating</div><div class="meta-value">' +
          (avg || "—") +
          " / 5</div></div>";

        // Highlights placeholder (can be extended)
        document.getElementById("detail-highlights").innerHTML =
          '<div class="highlight-card"><div class="highlight-icon">🌿</div><div class="highlight-title">Nature</div><div class="highlight-desc">Beautiful scenery</div></div>' +
          '<div class="highlight-card"><div class="highlight-icon">📸</div><div class="highlight-title">Photography</div><div class="highlight-desc">Iconic views</div></div>' +
          '<div class="highlight-card"><div class="highlight-icon">🏛</div><div class="highlight-title">Heritage</div><div class="highlight-desc">Rich history</div></div>' +
          '<div class="highlight-card"><div class="highlight-icon">🗺</div><div class="highlight-title">Explore</div><div class="highlight-desc">Guided tours</div></div>';

        document.getElementById("detail-map-link").href =
          "https://maps.google.com/?q=" +
          encodeURIComponent(d.name + " Sri Lanka");
      }

      // ── Load reviews ──────────────────────────────────────
      function loadReviews() {
        fetch(API + "?action=fetch_reviews&dest_id=" + DEST_ID)
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            var list = document.getElementById("reviewsList");
            var avg = parseFloat(data.avg_rating) || 0;
            var cnt = parseInt(data.review_count) || 0;
            var stars = "";
            for (var i = 1; i <= 5; i++)
              stars += i <= Math.round(avg) ? "★" : "☆";

            document.getElementById("avg-big").textContent = avg
              ? avg.toFixed(1)
              : "—";
            document.getElementById("avg-stars").textContent = stars;
            document.getElementById("avg-count").textContent =
              cnt + (cnt === 1 ? " review" : " reviews");

            if (!data.data || !data.data.length) {
              list.innerHTML =
                '<div class="no-reviews">No reviews yet. Be the first to leave one!</div>';
              return;
            }
            list.innerHTML = data.data
              .map(function (r) {
                var s = "";
                for (var i = 1; i <= 5; i++) s += i <= r.rating ? "★" : "☆";
                return (
                  '<div class="review-card">' +
                  '<div class="review-top"><span class="reviewer-name">' +
                  escHtml(r.reviewer_name) +
                  "</span>" +
                  '<span class="review-stars">' +
                  s +
                  "</span></div>" +
                  '<div class="review-date">' +
                  r.date +
                  "</div>" +
                  '<div class="review-text">' +
                  escHtml(r.review_text) +
                  "</div>" +
                  "</div>"
                );
              })
              .join("");
          })
          .catch(function () {
            document.getElementById("reviewsList").innerHTML =
              '<div class="no-reviews">Failed to load reviews.</div>';
          });
      }

      // ── Star picker ───────────────────────────────────────
      document.querySelectorAll("#starPicker span").forEach(function (s) {
        s.addEventListener("mouseover", function () {
          highlightStars(+this.dataset.v);
        });
        s.addEventListener("mouseout", function () {
          highlightStars(selectedRating);
        });
        s.addEventListener("click", function () {
          selectedRating = +this.dataset.v;
          highlightStars(selectedRating);
        });
      });

      function highlightStars(n) {
        document.querySelectorAll("#starPicker span").forEach(function (s) {
          s.classList.toggle("on", +s.dataset.v <= n);
        });
      }

      // ── Submit review ─────────────────────────────────────
      function submitReview() {
        var name = document.getElementById("rev-name").value.trim();
        var text = document.getElementById("rev-text").value.trim();
        var btn = document.getElementById("submitRevBtn");

        if (!name || !text) {
          alert("Please enter your name and review.");
          return;
        }
        if (!selectedRating) {
          alert("Please select a star rating.");
          return;
        }

        btn.disabled = true;
        btn.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Posting...';

        var fd = new FormData();
        fd.append("destination_id", DEST_ID);
        fd.append("reviewer_name", name);
        fd.append("rating", selectedRating);
        fd.append("review_text", text);

        fetch(API + "?action=add_review", { method: "POST", body: fd })
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            if (data.success) {
              document.getElementById("rev-name").value = "";
              document.getElementById("rev-text").value = "";
              selectedRating = 0;
              highlightStars(0);
              loadReviews(); 
              loadDestination(); 
              btn.innerHTML =
                '<i class="fa-solid fa-check"></i> Review Posted!';
              btn.style.background = "#2d8a45";
              setTimeout(function () {
                btn.disabled = false;
                btn.innerHTML =
                  '<i class="fa-solid fa-paper-plane"></i> Post Review';
                btn.style.background = "";
              }, 3000);
            } else {
              alert("Failed: " + (data.message || "Unknown error"));
              btn.disabled = false;
              btn.innerHTML =
                '<i class="fa-solid fa-paper-plane"></i> Post Review';
            }
          })
          .catch(function () {
            alert("Network error. Try again.");
            btn.disabled = false;
            btn.innerHTML =
              '<i class="fa-solid fa-paper-plane"></i> Post Review';
          });
      }

      // ── Modal ─────────────────────────────────────────────
      function openModal() {
        document.getElementById("modalBackdrop").classList.add("open");
      }
      function closeModal() {
        document.getElementById("modalBackdrop").classList.remove("open");
      }
      function closeModalOutside(e) {
        if (e.target.id === "modalBackdrop") closeModal();
      }
      function confirmBooking() {
        closeModal();
        alert(
          "✅ Booking request sent!\nOur team will contact you within 24 hours.",
        );
      }

      // ── Helpers ───────────────────────────────────────────
      function escHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ── INIT ──────────────────────────────────────────────
      loadDestination();
      loadReviews();
    </script>
  </body>
</html>
